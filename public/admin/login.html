<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Login | iGREY Holdings</title>
  
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Admin Theme -->
  <link rel="stylesheet" href="admin.css" />

  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="admin.js"></script>

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #151f1a 0%, #0a0f0e 70%);
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }
    .login-card {
      background: var(--bg-panel);
      border: 0.5px solid var(--border-color);
      border-radius: var(--radius-panel);
      padding: 36px 32px;
      box-shadow: var(--shadow-lg), 0 0 50px rgba(0, 0, 0, 0.4);
    }
    .brand-mark {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
      text-align: center;
    }
    .brand-logo-badge {
      width: 46px;
      height: 46px;
      border-radius: 8px;
      background: linear-gradient(135deg, #c9a77c, #917551);
      color: #0a0f0e;
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(201, 167, 124, 0.25);
    }
    .brand-title {
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 600;
      color: #FAF8F4;
      letter-spacing: 0.04em;
      margin: 0 0 4px;
    }
    .brand-subtitle {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold-primary);
    }
    .login-error {
      display: none;
      background: rgba(224, 122, 111, 0.12);
      border: 0.5px solid rgba(224, 122, 111, 0.35);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--accent-red);
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 20px;
    }
    .login-footer-note {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 24px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-mark">
        <div class="brand-logo-badge">iG</div>
        <h1 class="brand-title">iGREY Holdings</h1>
        <div class="brand-subtitle">Executive Admin Portal</div>
      </div>

      <div id="login-error" class="login-error" role="alert"></div>

      <form id="admin-login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">Admin Email</label>
          <input
            type="email"
            id="login-email"
            class="form-control"
            placeholder="admin@igreyholdings.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label class="form-label" for="login-password">Password</label>
          <input
            type="password"
            id="login-password"
            class="form-control"
            placeholder="••••••••••••"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 14px;">
          <span id="btn-text">Sign In to Dashboard</span>
          <span id="btn-spinner" class="spinner" style="display: none; width: 16px; height: 16px; border-width: 2px;"></span>
        </button>
      </form>

      <div class="login-footer-note">
        Authorized personnel only. Public sign-up is disabled. All session events are cryptographically authenticated via Supabase Row-Level Security.
      </div>
    </div>
  </div>

  <script>
    (async function () {
      'use strict';
      const { getClient, checkAuth, showToast } = window.iGreyAdmin;

      // Rate limit helper using localStorage
      const RATE_KEY = 'igrey_admin_login_rate';
      const MAX_ATTEMPTS = 5;
      const LOCKOUT_MS = 60 * 1000; // 60 seconds

      function getRateState() {
        try {
          const raw = localStorage.getItem(RATE_KEY);
          if (!raw) return { count: 0, lockUntil: 0 };
          return JSON.parse(raw);
        } catch (e) {
          return { count: 0, lockUntil: 0 };
        }
      }

      function recordFailedAttempt() {
        const state = getRateState();
        state.count += 1;
        if (state.count >= MAX_ATTEMPTS) {
          state.lockUntil = Date.now() + LOCKOUT_MS;
        }
        localStorage.setItem(RATE_KEY, JSON.stringify(state));
        return state;
      }

      function clearRateState() {
        localStorage.removeItem(RATE_KEY);
      }

      const form = document.getElementById('admin-login-form');
      const emailInput = document.getElementById('login-email');
      const passInput = document.getElementById('login-password');
      const errorEl = document.getElementById('login-error');
      const submitBtn = document.getElementById('login-submit-btn');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
      }

      function clearError() {
        errorEl.textContent = '';
        errorEl.style.display = 'none';
      }

      function setLoading(isLoading) {
        if (isLoading) {
          submitBtn.disabled = true;
          btnText.style.display = 'none';
          btnSpinner.style.display = 'inline-block';
        } else {
          submitBtn.disabled = false;
          btnText.style.display = 'inline';
          btnSpinner.style.display = 'none';
        }
      }

      // Check if already authenticated
      await checkAuth(false);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();

        // Check rate limiter
        const rate = getRateState();
        if (rate.lockUntil && Date.now() < rate.lockUntil) {
          const remainingSec = Math.ceil((rate.lockUntil - Date.now()) / 1000);
          showError(`Too many failed attempts. Please wait ${remainingSec} seconds before retrying.`);
          return;
        }

        const email = emailInput.value.trim();
        const password = passInput.value;

        if (!email || !password) {
          showError('Please enter both email and password.');
          return;
        }

        const client = getClient();
        if (!client) {
          showError('Supabase is not configured yet. Please enter your credentials into js/supabase-config.js.');
          return;
        }

        setLoading(true);

        try {
          const { data, error } = await client.auth.signInWithPassword({
            email,
            password,
          });

          if (error) {
            recordFailedAttempt();
            showError('Wrong email or password.');
            setLoading(false);
            return;
          }

          if (data && data.user) {
            // Verify if email is authorized in the admins table
            const { data: adminRow, error: adminErr } = await client
              .from('admins')
              .select('email')
              .eq('email', data.user.email)
              .maybeSingle();

            if (adminErr || !adminRow) {
              // Sign out immediately if not in admins whitelist
              await client.auth.signOut();
              recordFailedAttempt();
              showError('Access denied. Your email is not registered in the admins authorized list.');
              setLoading(false);
              return;
            }

            // Successful login
            clearRateState();
            showToast('success', 'Welcome Back', 'Redirecting to executive dashboard...');
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 600);
          }
        } catch (err) {
          recordFailedAttempt();
          showError(err.message || 'Authentication failed. Please check network connection.');
          setLoading(false);
        }
      });
    })();
  </script>
</body>
</html>
