<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Client Inquiries | iGREY Holdings Admin</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Admin Theme -->
  <link rel="stylesheet" href="admin.css" />

  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="admin.js"></script>

  <style>
    .filter-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-bottom: 16px;
    }
    .filter-tab {
      background: var(--bg-panel);
      border: 0.5px solid var(--border-color);
      color: var(--text-secondary);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition-fast);
    }
    .filter-tab.active {
      background: rgba(201, 167, 124, 0.15);
      border-color: var(--gold-primary);
      color: var(--gold-primary);
    }
    .filter-tab .badge {
      font-size: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 1px 6px;
      margin-left: 4px;
    }
    .filter-tab.active .badge {
      background: var(--gold-primary);
      color: #0a0f0e;
    }
    /* Side detail drawer */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition-normal);
    }
    .drawer-backdrop.active {
      opacity: 1;
      visibility: visible;
    }
    .drawer-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-width: 460px;
      background: #0d1311;
      border-left: 0.5px solid var(--border-color);
      box-shadow: -4px 0 24px rgba(0, 0, 0, 0.6);
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      z-index: 1001;
    }
    .drawer-backdrop.active .drawer-panel {
      transform: translateX(0);
    }
    .drawer-header {
      padding: 20px 24px;
      border-bottom: 0.5px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .drawer-body {
      padding: 24px;
      flex: 1;
      overflow-y: auto;
    }
    .drawer-footer {
      padding: 16px 24px;
      border-top: 0.5px solid var(--border-color);
      background: #0a0f0e;
      display: flex;
      gap: 10px;
    }
    .info-group {
      margin-bottom: 20px;
    }
    .info-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .info-value {
      font-size: 14px;
      color: #FAF8F4;
    }
  </style>
</head>
<body>

  <!-- Injected Sidebar & Drawer -->
  <div id="admin-sidebar-container"></div>

  <!-- Main Content Wrap -->
  <div class="admin-main">
    <!-- Injected Topbar -->
    <div id="admin-topbar-container"></div>

    <main class="admin-content">
      <!-- Page Header -->
      <div class="page-header">
        <div>
          <h1 class="page-title">Client Inquiries</h1>
          <p class="page-subtitle">Prospective buyer communications submitted via the iGrey Holdings portal.</p>
        </div>
      </div>

      <!-- Filter Tabs -->
      <div class="filter-tabs" id="enquiry-filter-tabs">
        <button type="button" class="filter-tab active" data-status="all">All Inquiries <span class="badge" id="badge-all">0</span></button>
        <button type="button" class="filter-tab" data-status="new">New / Uncontacted <span class="badge" id="badge-new">0</span></button>
        <button type="button" class="filter-tab" data-status="contacted">Contacted <span class="badge" id="badge-contacted">0</span></button>
        <button type="button" class="filter-tab" data-status="closed">Closed <span class="badge" id="badge-closed">0</span></button>
      </div>

      <!-- Search Field -->
      <div style="max-width: 420px; margin-bottom: 18px; position: relative;">
        <input type="text" id="enquiry-search" class="form-control" placeholder="Search by name, phone, email, or message..." />
      </div>

      <!-- Inquiries Table -->
      <div class="panel" style="padding: 0; overflow: hidden;">
        <div id="enquiries-table-container">
          <div style="padding: 32px 24px;">
            <div class="skeleton-line" style="height: 48px; margin-bottom: 12px;"></div>
            <div class="skeleton-line" style="height: 48px; margin-bottom: 12px;"></div>
            <div class="skeleton-line" style="height: 48px;"></div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- Detail Drawer -->
  <div class="drawer-backdrop" id="detail-drawer">
    <div class="drawer-panel">
      <div class="drawer-header">
        <div>
          <h3 style="font-family: var(--font-serif); font-size: 20px; color: #FAF8F4; margin: 0;" id="drawer-name">Client Inquiry</h3>
          <span style="font-size: 11.5px; color: var(--text-muted);" id="drawer-date">Timestamp</span>
        </div>
        <button type="button" class="modal-close-btn" id="drawer-close-btn" aria-label="Close drawer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="drawer-body">
        <div class="info-group">
          <div class="info-label">Inquiry Status</div>
          <select id="drawer-status-select" class="form-control" style="font-size: 13px; padding: 6px 12px; margin-top: 4px;">
            <option value="new">New</option>
            <option value="contacted">Contacted</option>
            <option value="closed">Closed</option>
          </select>
        </div>

        <div class="info-group">
          <div class="info-label">Contact Information</div>
          <div style="font-size: 14px; color: #FAF8F4; line-height: 1.6;">
            <div>Phone: <strong id="drawer-phone">—</strong></div>
            <div>Email: <strong id="drawer-email">—</strong></div>
            <div>City: <span id="drawer-city">—</span></div>
            <div>Client Role: <span id="drawer-role">Prospective Buyer</span></div>
          </div>
        </div>

        <div class="info-group" id="drawer-property-wrap" style="display: none;">
          <div class="info-label">Referenced Estate</div>
          <div style="background: var(--bg-card); border: 0.5px solid var(--border-color); padding: 10px 14px; border-radius: 6px;">
            <div style="font-weight: 600; color: #FAF8F4; font-size: 13px;" id="drawer-prop-code">Code: —</div>
          </div>
        </div>

        <div class="info-group">
          <div class="info-label">Inquiry Message</div>
          <div style="background: rgba(0,0,0,0.3); border: 0.5px solid var(--border-color); border-radius: 6px; padding: 14px; font-size: 13.5px; color: var(--text-secondary); line-height: 1.6; white-space: pre-wrap;" id="drawer-message">
            —
          </div>
        </div>
      </div>

      <div class="drawer-footer">
        <a href="#" id="drawer-call-btn" class="btn btn-secondary" style="flex: 1; justify-content: center;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          Call Client
        </a>
        <a href="#" id="drawer-mail-btn" class="btn btn-primary" style="flex: 1; justify-content: center;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          Email Client
        </a>
      </div>
    </div>
  </div>

  <script>
    (async function () {
      'use strict';
      const {
        renderLayout,
        checkAuth,
        getClient,
        formatDate,
        escapeHtml,
        showToast,
        showConfirmModal
      } = window.iGreyAdmin;

      renderLayout({ activeTab: 'enquiries', title: 'Client Inquiries' });

      const session = await checkAuth(true);
      if (!session) return;

      const client = getClient();
      if (!client) return;

      let allEnquiries = [];
      let currentFilter = 'all';
      let searchQuery = '';
      let activeItem = null;

      // Drawer elements
      const drawer = document.getElementById('detail-drawer');
      const drawerCloseBtn = document.getElementById('drawer-close-btn');

      function openDrawer(item) {
        activeItem = item;
        document.getElementById('drawer-name').textContent = item.name || 'Anonymous Client';
        document.getElementById('drawer-date').textContent = formatDate(item.created_at);
        document.getElementById('drawer-phone').textContent = item.phone || 'Not provided';
        document.getElementById('drawer-email').textContent = item.email || 'Not provided';
        document.getElementById('drawer-city').textContent = item.city || '—';
        document.getElementById('drawer-role').textContent = item.role || 'Prospective Buyer';
        document.getElementById('drawer-message').textContent = item.message || 'No additional message.';
        document.getElementById('drawer-status-select').value = item.status || 'new';

        // Call / Mail action links
        const callBtn = document.getElementById('drawer-call-btn');
        if (item.phone) {
          callBtn.href = `tel:${item.phone}`;
          callBtn.style.display = 'inline-flex';
        } else {
          callBtn.style.display = 'none';
        }

        const mailBtn = document.getElementById('drawer-mail-btn');
        if (item.email) {
          mailBtn.href = `mailto:${item.email}?subject=${encodeURIComponent('iGREY Holdings — In response to your property enquiry')}`;
          mailBtn.style.display = 'inline-flex';
        } else {
          mailBtn.style.display = 'none';
        }

        const propWrap = document.getElementById('drawer-property-wrap');
        if (item.property_code) {
          propWrap.style.display = 'block';
          document.getElementById('drawer-prop-code').textContent = `Property ID: ${item.property_code}`;
        } else {
          propWrap.style.display = 'none';
        }

        drawer.classList.add('active');
      }

      function closeDrawer() {
        drawer.classList.remove('active');
        activeItem = null;
      }

      drawerCloseBtn.onclick = closeDrawer;
      drawer.onclick = (e) => {
        if (e.target === drawer) closeDrawer();
      };

      // Drawer status changer
      document.getElementById('drawer-status-select').addEventListener('change', async (e) => {
        if (!activeItem) return;
        const newStatus = e.target.value;
        try {
          const { error } = await client
            .from('enquiries')
            .update({ status: newStatus })
            .eq('id', activeItem.id);

          if (error) throw error;
          activeItem.status = newStatus;
          showToast('success', 'Status Updated', `Inquiry status changed to ${newStatus}.`);
          updateCounts();
          renderList();
        } catch (err) {
          showToast('error', 'Update Failed', err.message);
          e.target.value = activeItem.status;
        }
      });

      async function fetchEnquiries() {
        try {
          const { data, error } = await client
            .from('enquiries')
            .select('*')
            .order('created_at', { ascending: false });

          if (error) throw error;
          allEnquiries = data || [];
          updateCounts();
          renderList();

          // Check if specific ID in URL
          const urlParams = new URLSearchParams(window.location.search);
          const targetId = urlParams.get('id');
          if (targetId) {
            const found = allEnquiries.find(e => String(e.id) === String(targetId));
            if (found) openDrawer(found);
          }
        } catch (err) {
          document.getElementById('enquiries-table-container').innerHTML = `
            <div style="padding: 32px; color: var(--accent-red); font-size: 13.5px;">
              Failed to load inquiries: ${escapeHtml(err.message)}
            </div>
          `;
        }
      }

      function updateCounts() {
        document.getElementById('badge-all').textContent = allEnquiries.length;
        document.getElementById('badge-new').textContent = allEnquiries.filter(e => e.status === 'new').length;
        document.getElementById('badge-contacted').textContent = allEnquiries.filter(e => e.status === 'contacted').length;
        document.getElementById('badge-closed').textContent = allEnquiries.filter(e => e.status === 'closed').length;
      }

      function renderList() {
        let list = [...allEnquiries];

        if (currentFilter !== 'all') {
          list = list.filter(e => e.status === currentFilter);
        }

        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          list = list.filter(e =>
            (e.name && e.name.toLowerCase().includes(q)) ||
            (e.phone && e.phone.includes(q)) ||
            (e.email && e.email.toLowerCase().includes(q)) ||
            (e.message && e.message.toLowerCase().includes(q)) ||
            (e.property_code && e.property_code.toLowerCase().includes(q))
          );
        }

        const container = document.getElementById('enquiries-table-container');

        if (list.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              <div class="empty-title">No client inquiries found</div>
              <div class="empty-desc">Any inquiries submitted from the website form will appear here.</div>
            </div>
          `;
          return;
        }

        const rowsHtml = list.map(item => {
          const status = item.status || 'new';
          const statusText = status.toUpperCase();

          return `
            <tr>
              <td>
                <div style="font-weight: 600; color: #FAF8F4; font-size: 13.5px;">${escapeHtml(item.name)}</div>
                <div style="color: var(--text-muted); font-size: 11.5px; margin-top: 2px;">
                  ${escapeHtml(item.city || 'India')} &bull; ${escapeHtml(item.role || 'Prospective Buyer')}
                  ${item.property_code ? `&bull; <span style="color: #c9a77c;">ID: ${escapeHtml(item.property_code)}</span>` : ''}
                </div>
              </td>
              <td style="font-size: 13px;">
                <div><a href="tel:${escapeHtml(item.phone)}" style="color: var(--gold-primary); text-decoration: none;">${escapeHtml(item.phone || '—')}</a></div>
                <div style="color: var(--text-muted); font-size: 12px;">${escapeHtml(item.email || '—')}</div>
              </td>
              <td style="max-width: 260px; font-size: 12.5px; color: var(--text-secondary); line-height: 1.4;">
                ${escapeHtml(item.message ? (item.message.length > 70 ? item.message.slice(0, 70) + '...' : item.message) : '—')}
              </td>
              <td>
                <span class="status-pill ${status}">${statusText}</span>
              </td>
              <td style="color: var(--text-muted); font-size: 12px; white-space: nowrap;">
                ${formatDate(item.created_at)}
              </td>
              <td>
                <div class="table-actions">
                  <button type="button" class="btn-action view-drawer-btn" data-id="${item.id}" title="Open Details Drawer">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                  ${item.phone ? `
                    <a href="tel:${escapeHtml(item.phone)}" class="btn-action" title="Call Client" style="color: #52b788;">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                    </a>
                  ` : ''}
                  <button type="button" class="btn-action delete-enquiry-btn" data-id="${item.id}" style="color: var(--accent-red);" title="Delete Inquiry">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                  </button>
                </div>
              </td>
            </tr>
          `;
        }).join('');

        container.innerHTML = `
          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Client</th>
                  <th>Contact Info</th>
                  <th>Message Preview</th>
                  <th>Status</th>
                  <th>Received</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${rowsHtml}
              </tbody>
            </table>
          </div>
        `;

        // Attach action events
        container.querySelectorAll('.view-drawer-btn').forEach(btn => {
          btn.onclick = () => {
            const id = btn.getAttribute('data-id');
            const item = allEnquiries.find(e => String(e.id) === String(id));
            if (item) openDrawer(item);
          };
        });

        container.querySelectorAll('.delete-enquiry-btn').forEach(btn => {
          btn.onclick = () => {
            const id = btn.getAttribute('data-id');
            const item = allEnquiries.find(e => String(e.id) === String(id));
            if (!item) return;

            showConfirmModal({
              title: `Delete inquiry from ${item.name || 'client'}?`,
              message: 'This will permanently delete this inquiry record from the database.',
              confirmText: 'Delete Inquiry',
              confirmClass: 'btn-danger',
              onConfirm: async () => {
                try {
                  const { error } = await client
                    .from('enquiries')
                    .delete()
                    .eq('id', id);

                  if (error) throw error;
                  allEnquiries = allEnquiries.filter(e => String(e.id) !== String(id));
                  showToast('success', 'Inquiry Deleted', 'The inquiry has been deleted.');
                  updateCounts();
                  renderList();
                } catch (err) {
                  showToast('error', 'Delete Failed', err.message);
                }
              }
            });
          };
        });
      }

      // Filter tabs event
      document.querySelectorAll('#enquiry-filter-tabs .filter-tab').forEach(tab => {
        tab.onclick = () => {
          document.querySelectorAll('#enquiry-filter-tabs .filter-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentFilter = tab.getAttribute('data-status');
          renderList();
        };
      });

      // Search input (debounced)
      let searchTimeout;
      document.getElementById('enquiry-search').addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          searchQuery = e.target.value.trim();
          renderList();
        }, 200);
      });

      // Initial Fetch
      await fetchEnquiries();

    })();
  </script>
</body>
</html>
