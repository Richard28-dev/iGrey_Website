<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Properties | iGREY Holdings Admin</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Admin Theme & Favicon -->
  <link rel="icon" type="image/png" href="../logo-mark.png" />
  <link rel="stylesheet" href="admin.css?v=4" />

  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="admin.js?v=4"></script>

  <style>
    .filter-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      margin-bottom: 16px;
    }
    .filter-tab {
      background: var(--bg-panel);
      border: 0.5px solid var(--border-color);
      color: var(--text-secondary);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition-fast);
    }
    .filter-tab:hover {
      border-color: rgba(201, 167, 124, 0.4);
      color: var(--text-primary);
    }
    .filter-tab.active {
      background: rgba(201, 167, 124, 0.15);
      border-color: var(--gold-primary);
      color: var(--gold-primary);
    }
    .filter-tab .badge {
      font-size: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 1px 6px;
      margin-left: 4px;
    }
    .filter-tab.active .badge {
      background: var(--gold-primary);
      color: #0a0f0e;
    }
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }
    .search-input-wrap {
      position: relative;
      min-width: 260px;
      flex: 1;
      max-width: 400px;
    }
    .search-input-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    .search-input-wrap input {
      padding-left: 40px !important;
      width: 100%;
    }
    .sort-select {
      background: var(--bg-panel);
      border: 0.5px solid var(--border-color);
      color: var(--text-primary);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      font-family: inherit;
    }
    .inline-status-select {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      transition: all 0.2s ease;
      outline: none;
    }
    .inline-status-select.status-available {
      background: rgba(34, 197, 94, 0.15) !important;
      color: #22c55e !important;
      border-color: rgba(34, 197, 94, 0.4) !important;
    }
    .inline-status-select.status-upcoming {
      background: rgba(59, 130, 246, 0.15) !important;
      color: #3b82f6 !important;
      border-color: rgba(59, 130, 246, 0.4) !important;
    }
    .inline-status-select.status-under_construction,
    .inline-status-select.status-underconstruction,
    .inline-status-select.status-under_offer,
    .inline-status-select.status-underoffer {
      background: rgba(249, 115, 22, 0.15) !important;
      color: #f97316 !important;
      border-color: rgba(249, 115, 22, 0.4) !important;
    }
    .inline-status-select.status-sold {
      background: rgba(239, 68, 68, 0.15) !important;
      color: #ef4444 !important;
      border-color: rgba(239, 68, 68, 0.4) !important;
    }
    .inline-status-select.status-draft {
      background: rgba(156, 163, 175, 0.15) !important;
      color: #9ca3af !important;
      border-color: rgba(156, 163, 175, 0.35) !important;
    }
  </style>
</head>
<body>

  <!-- Injected Sidebar & Drawer -->
  <div id="admin-sidebar-container"></div>

  <!-- Main Content Wrap -->
  <div class="admin-main admin-main-wrap">
    <!-- Injected Topbar -->
    <div id="admin-topbar-container"></div>

    <main class="admin-content">
      <!-- Page Header -->
      <div class="page-header">
        <div>
          <h1 class="page-title">Portfolio Listings</h1>
          <p class="page-subtitle">Manage estate listings, pricing, availability, and marketing assets.</p>
        </div>
        <div class="page-actions">
          <a href="property-form.html" class="btn btn-primary">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            + Add Property
          </a>
        </div>
      </div>

      <!-- Filter Tabs -->
      <div class="filter-tabs" id="filter-tabs-wrap" role="tablist">
        <button type="button" class="filter-tab active" data-status="all" role="tab">All Listings <span class="badge" id="count-all">0</span></button>
        <button type="button" class="filter-tab" data-status="available" role="tab">Available <span class="badge" id="count-available">0</span></button>
        <button type="button" class="filter-tab" data-status="upcoming" role="tab">Upcoming <span class="badge" id="count-upcoming">0</span></button>
        <button type="button" class="filter-tab" data-status="under_construction" role="tab">Under Construction <span class="badge" id="count-under_construction">0</span></button>
        <button type="button" class="filter-tab" data-status="under_offer" role="tab">Under Offer <span class="badge" id="count-under_offer">0</span></button>
        <button type="button" class="filter-tab" data-status="sold" role="tab">Sold <span class="badge" id="count-sold">0</span></button>
        <button type="button" class="filter-tab" data-status="draft" role="tab">Drafts <span class="badge" id="count-draft">0</span></button>
      </div>

      <!-- Controls Row: Search + Sort -->
      <div class="controls-row">
        <div class="search-input-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="property-search" class="form-control" placeholder="Search by title, locality, city, or ID..." />
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <label for="sort-select" style="font-size: 12.5px; color: var(--text-muted);">Sort By:</label>
          <select id="sort-select" class="sort-select">
            <option value="created_desc">Newest First</option>
            <option value="created_asc">Oldest First</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="title_asc">Title: A-Z</option>
          </select>
        </div>
      </div>

      <!-- Listings Table / Cards -->
      <div class="panel" style="padding: 0; overflow: hidden;">
        <div id="table-container">
          <div style="padding: 32px 24px;">
            <div class="skeleton-line" style="height: 44px; margin-bottom: 12px;"></div>
            <div class="skeleton-line" style="height: 44px; margin-bottom: 12px;"></div>
            <div class="skeleton-line" style="height: 44px; margin-bottom: 12px;"></div>
            <div class="skeleton-line" style="height: 44px;"></div>
          </div>
        </div>

        <!-- Pagination Bar -->
        <div class="pagination-bar" id="pagination-container" style="display: none;">
          <div class="pagination-info" id="pagination-info">Showing 1 to 10 of 24 properties</div>
          <div class="pagination-buttons">
            <button type="button" class="pagination-btn" id="page-prev-btn" disabled>&larr; Previous</button>
            <span id="page-current-num" style="font-size: 12.5px; color: var(--text-secondary); padding: 0 4px;">Page 1</span>
            <button type="button" class="pagination-btn" id="page-next-btn">Next &rarr;</button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script>
    (async function () {
      'use strict';
      const {
        renderLayout,
        checkAuth,
        getClient,
        formatIndianPrice,
        escapeHtml,
        showConfirmModal,
        showToast,
        showPropertyPreviewModal
      } = window.iGreyAdmin;

      renderLayout({ activeTab: 'properties', title: 'Portfolio Listings' });

      const session = await checkAuth(true);
      if (!session) return;

      const client = getClient();
      if (!client) return;

      // State
      let allItems = [];
      let currentFilter = 'all';
      let searchQuery = '';
      let currentSort = 'created_desc';
      let currentPage = 1;
      const pageSize = 10;

      // Parse initial URL query params (?q=...)
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('q')) {
        searchQuery = urlParams.get('q').trim();
        const searchInput = document.getElementById('property-search');
        if (searchInput) searchInput.value = searchQuery;
      }

      // Fetch all properties
      async function fetchProperties() {
        try {
          const { data, error } = await client
            .from('properties')
            .select('*')
            .order('created_at', { ascending: false });

          if (error) throw error;
          allItems = data || [];
          updateCounts();
          renderFilteredList();
        } catch (err) {
          console.error(err);
          document.getElementById('table-container').innerHTML = `
            <div style="padding: 32px; color: var(--accent-red); font-size: 13.5px;">
              Failed to load properties: ${escapeHtml(err.message)}
            </div>
          `;
        }
      }

      function updateCounts() {
        document.getElementById('count-all').textContent = allItems.length;
        document.getElementById('count-available').textContent = allItems.filter(p => p.status === 'available').length;
        document.getElementById('count-upcoming').textContent = allItems.filter(p => p.status === 'upcoming').length;
        document.getElementById('count-under_construction').textContent = allItems.filter(p => p.status === 'under_construction').length;
        document.getElementById('count-under_offer').textContent = allItems.filter(p => p.status === 'under_offer').length;
        document.getElementById('count-sold').textContent = allItems.filter(p => p.status === 'sold').length;
        document.getElementById('count-draft').textContent = allItems.filter(p => p.status === 'draft' || !p.is_published).length;
      }

      function filterAndSortItems() {
        let filtered = [...allItems];

        // Status Filter
        if (currentFilter === 'draft') {
          filtered = filtered.filter(p => p.status === 'draft' || !p.is_published);
        } else if (currentFilter !== 'all') {
          filtered = filtered.filter(p => p.status === currentFilter);
        }

        // Search Query
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          filtered = filtered.filter(p =>
            (p.title && p.title.toLowerCase().includes(q)) ||
            (p.locality && p.locality.toLowerCase().includes(q)) ||
            (p.city && p.city.toLowerCase().includes(q)) ||
            (p.property_code && p.property_code.toLowerCase().includes(q))
          );
        }

        // Sort
        filtered.sort((a, b) => {
          if (currentSort === 'created_desc') return new Date(b.created_at) - new Date(a.created_at);
          if (currentSort === 'created_asc') return new Date(a.created_at) - new Date(b.created_at);
          if (currentSort === 'price_asc') return (Number(a.price) || 0) - (Number(b.price) || 0);
          if (currentSort === 'price_desc') return (Number(b.price) || 0) - (Number(a.price) || 0);
          if (currentSort === 'title_asc') return (a.title || '').localeCompare(b.title || '');
          return 0;
        });

        return filtered;
      }

      function renderFilteredList() {
        const filtered = filterAndSortItems();
        const totalItems = filtered.length;
        const totalPages = Math.ceil(totalItems / pageSize) || 1;

        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const startIndex = (currentPage - 1) * pageSize;
        const pageItems = filtered.slice(startIndex, startIndex + pageSize);

        const container = document.getElementById('table-container');
        const paginationWrap = document.getElementById('pagination-container');

        if (totalItems === 0) {
          paginationWrap.style.display = 'none';
          container.innerHTML = `
            <div class="empty-state">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              <div class="empty-title">No matching listings found</div>
              <div class="empty-desc">Try clearing your search filters or status selection.</div>
            </div>
          `;
          return;
        }

        paginationWrap.style.display = 'flex';
        document.getElementById('pagination-info').textContent = `Showing ${startIndex + 1} to ${Math.min(startIndex + pageSize, totalItems)} of ${totalItems} properties`;
        document.getElementById('page-current-num').textContent = `Page ${currentPage} of ${totalPages}`;
        document.getElementById('page-prev-btn').disabled = (currentPage === 1);
        document.getElementById('page-next-btn').disabled = (currentPage === totalPages);

        const rowsHtml = pageItems.map(item => {
          const thumb = (item.images && item.images.length > 0 && item.images[0])
            ? item.images[0]
            : window.iGreyAdmin.PROPERTY_PLACEHOLDER;
          const status = item.status || 'available';

          return `
            <tr>
              <td data-label="Property" class="prop-main-td">
                <div class="prop-cell">
                  <img
                    src="${thumb}"
                    alt="${escapeHtml(item.title)}"
                    class="property-thumb"
                    width="56"
                    height="44"
                    loading="lazy"
                    onerror="this.onerror=null; this.src=window.iGreyAdmin.PROPERTY_PLACEHOLDER;"
                  />
                  <div class="prop-cell-text">
                    <div class="prop-cell-title">
                      ${escapeHtml(item.title)}
                      ${item.is_featured ? `<span class="badge-featured">FEATURED</span>` : ''}
                    </div>
                    <div class="prop-cell-sub">
                      ${escapeHtml(item.property_type || 'Villa')} &bull; ${escapeHtml(item.bedrooms || '3')} BHK &bull; ID: <code>${escapeHtml(item.property_code)}</code>
                    </div>
                  </div>
                </div>
              </td>
              <td data-label="City" style="color: var(--text-secondary); font-size: 13px;">
                <div style="font-weight: 500;">${escapeHtml(item.city || '—')}</div>
                ${item.locality ? `<div style="color: var(--text-muted); font-size: 11.5px; margin-top: 2px;">${escapeHtml(item.locality)}</div>` : ''}
              </td>
              <td data-label="Price" class="price-text">
                ${formatIndianPrice(item.price)}
              </td>
              <td data-label="Status">
                <select class="inline-status-select status-select-btn status-${status}" data-id="${item.id}" aria-label="Change status for ${escapeHtml(item.title)}">
                  <option value="available" ${status === 'available' ? 'selected' : ''}>Available</option>
                  <option value="upcoming" ${status === 'upcoming' ? 'selected' : ''}>Upcoming</option>
                  <option value="under_construction" ${status === 'under_construction' ? 'selected' : ''}>Under Construction</option>
                  <option value="under_offer" ${status === 'under_offer' ? 'selected' : ''}>Under Offer</option>
                  <option value="sold" ${status === 'sold' ? 'selected' : ''}>Sold</option>
                  <option value="draft" ${status === 'draft' ? 'selected' : ''}>Draft</option>
                </select>
              </td>
              <td data-label="Actions" class="actions-td">
                <div class="table-actions">
                  <button type="button" class="btn-action view-btn" data-id="${item.id}" title="Preview Details" aria-label="Preview ${escapeHtml(item.title)}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                  <a href="property-form.html?id=${item.id}" class="btn-action" title="Edit Property" aria-label="Edit ${escapeHtml(item.title)}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
                  </a>
                  <button type="button" class="btn-action delete-btn" data-id="${item.id}" style="color: var(--accent-red);" title="Delete Property" aria-label="Delete ${escapeHtml(item.title)}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                  </button>
                </div>
              </td>
            </tr>
          `;
        }).join('');

        container.innerHTML = `
          <div class="table-responsive">
            <table class="admin-table prop-table">
              <colgroup>
                <col class="col-property" style="width: 38%;">
                <col class="col-city" style="width: 14%;">
                <col class="col-price" style="width: 14%;">
                <col class="col-status" style="width: 16%;">
                <col class="col-actions" style="width: 18%;">
              </colgroup>
              <thead>
                <tr>
                  <th style="width: 38%;">Property</th>
                  <th style="width: 14%;">City</th>
                  <th style="width: 14%;">Price</th>
                  <th style="width: 16%;">Status</th>
                  <th style="width: 18%; text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${rowsHtml}
              </tbody>
            </table>
          </div>
        `;

        // Attach Handlers
        // 1. Quick status change
        container.querySelectorAll('.status-select-btn').forEach(select => {
          select.onchange = async () => {
            const newStatus = select.value;
            const propId = select.getAttribute('data-id');
            const prop = allItems.find(p => String(p.id) === String(propId));
            if (!prop) return;

            const oldStatus = prop.status;

            try {
              const { error } = await client
                .from('properties')
                .update({ status: newStatus, is_published: newStatus !== 'draft', updated_at: new Date().toISOString() })
                .eq('id', propId);

              if (error) throw error;
              prop.status = newStatus;
              prop.is_published = (newStatus !== 'draft');
              select.className = `inline-status-select status-select-btn status-${newStatus}`;
              showToast('success', 'Status Updated', `Property marked as ${newStatus.replace('_', ' ')}.`);
              updateCounts();
            } catch (err) {
              select.value = oldStatus;
              select.className = `inline-status-select status-select-btn status-${oldStatus}`;
              if (err.message && err.message.includes('properties_status_check')) {
                showConstraintModal(newStatus);
              } else {
                showToast('error', 'Update Failed', err.message);
              }
            }
          };
        });

        // 2. View Preview
        container.querySelectorAll('.view-btn').forEach(btn => {
          btn.onclick = () => {
            const propId = btn.getAttribute('data-id');
            const prop = allItems.find(p => String(p.id) === String(propId));
            if (prop) showPropertyPreviewModal(prop);
          };
        });

        // 3. Delete with storage removal
        container.querySelectorAll('.delete-btn').forEach(btn => {
          btn.onclick = () => {
            const propId = btn.getAttribute('data-id');
            const prop = allItems.find(p => String(p.id) === String(propId));
            if (!prop) return;

            showConfirmModal({
              title: `Delete "${prop.title}"?`,
              message: 'This will permanently remove this property listing and delete its uploaded images from storage. This action cannot be undone.',
              confirmText: 'Delete Property',
              confirmClass: 'btn-danger',
              onConfirm: async () => {
                try {
                  // Delete storage photos if they are in 'property-images' bucket
                  if (Array.isArray(prop.images) && prop.images.length > 0) {
                    const filePaths = prop.images
                      .filter(url => url.includes('/property-images/'))
                      .map(url => {
                        const parts = url.split('/property-images/');
                        return parts[parts.length - 1];
                      })
                      .filter(Boolean);

                    if (filePaths.length > 0) {
                      await client.storage.from('property-images').remove(filePaths);
                    }
                  }

                  // Delete from database
                  const { error } = await client
                    .from('properties')
                    .delete()
                    .eq('id', propId);

                  if (error) throw error;

                  allItems = allItems.filter(p => String(p.id) !== String(propId));
                  showToast('success', 'Property Deleted', 'The listing has been permanently removed.');
                  updateCounts();
                  renderFilteredList();
                } catch (err) {
                  showToast('error', 'Delete Failed', err.message);
                }
              }
            });
          };
        });
      }

      // Event Listeners
      // Filter Tabs
      document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.onclick = () => {
          document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentFilter = tab.getAttribute('data-status');
          currentPage = 1;
          renderFilteredList();
        };
      });

      // Search (debounced)
      let searchTimeout;
      document.getElementById('property-search').addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          searchQuery = e.target.value.trim();
          currentPage = 1;
          renderFilteredList();
        }, 250);
      });

      // Sort
      document.getElementById('sort-select').addEventListener('change', (e) => {
        currentSort = e.target.value;
        renderFilteredList();
      });

      // Pagination
      document.getElementById('page-prev-btn').addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage--;
          renderFilteredList();
        }
      });

      document.getElementById('page-next-btn').addEventListener('click', () => {
        currentPage++;
        renderFilteredList();
      });

      function showConstraintModal(attemptedStatus) {
        const sqlCmd = `ALTER TABLE public.properties DROP CONSTRAINT IF EXISTS properties_status_check;\nALTER TABLE public.properties ADD CONSTRAINT properties_status_check CHECK (status IN ('available', 'upcoming', 'under_construction', 'under_offer', 'sold', 'draft'));`;
        
        const modal = document.createElement('div');
        modal.className = 'modal-backdrop active';
        modal.style.zIndex = '9999';
        modal.innerHTML = `
          <div class="modal-card" style="max-width: 580px; padding: 24px;">
            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px;">
              <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 36px; height: 36px; border-radius: 50%; background: rgba(224, 122, 111, 0.15); color: var(--accent-red); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                </div>
                <div>
                  <h3 style="font-family: var(--font-serif); font-size: 20px; color: #FAF8F4; margin: 0;">Supabase Database Constraint Update</h3>
                  <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">One-time SQL command required in Supabase</div>
                </div>
              </div>
              <button type="button" class="btn-action close-modal-btn" style="border: none; background: transparent; cursor: pointer;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>
            
            <p style="font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 14px;">
              Your database currently has a PostgreSQL <code>CHECK</code> constraint that only accepts initial statuses. To save <strong>${escapeHtml(attemptedStatus.replace('_', ' '))}</strong> and new statuses, run this command in your Supabase SQL Editor:
            </p>

            <div style="position: relative; background: #070c0a; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px 14px; margin-bottom: 16px;">
              <pre style="margin: 0; font-family: monospace; font-size: 12px; color: #E8D5B7; white-space: pre-wrap; word-break: break-all;">${sqlCmd}</pre>
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
              <button type="button" class="btn btn-primary" id="copy-sql-btn" style="padding: 8px 16px; font-size: 12.5px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 6px;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                Copy SQL to Clipboard
              </button>
              <div style="display: flex; gap: 8px;">
                <a href="https://supabase.com/dashboard/project/xygaqwwflbdrtgjqughu/sql/new" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" style="padding: 8px 14px; font-size: 12.5px;">
                  Open Supabase SQL Editor &rarr;
                </a>
                <button type="button" class="btn btn-secondary close-modal-btn" style="padding: 8px 14px; font-size: 12.5px;">Close</button>
              </div>
            </div>
          </div>
        `;
        document.body.appendChild(modal);

        modal.querySelectorAll('.close-modal-btn').forEach(b => {
          b.onclick = () => modal.remove();
        });

        const copyBtn = modal.querySelector('#copy-sql-btn');
        copyBtn.onclick = () => {
          navigator.clipboard.writeText(sqlCmd).then(() => {
            copyBtn.innerHTML = `✓ Copied SQL to Clipboard!`;
            setTimeout(() => {
              copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 6px;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy SQL to Clipboard`;
            }, 3000);
          });
        };
      }

      // Initial Fetch
      await fetchProperties();

    })();
  </script>
</body>
</html>
