<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find Your Perfect Home | iGrey Holdings</title>
    <meta
      name="description"
      content="Find your perfect home with iGrey Holdings. Explore verified luxury residences, gated society apartments, architectural villas, and prime plots across Bangalore, Mysuru, Hyderabad, and Chennai."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230C0D0E'/><text x='50%' y='62%' font-family='serif' font-size='56' fill='%23C5A880' text-anchor='middle'>iG</text></svg>"
    />

    <!-- Google Fonts: Cormorant Garamond, Manrope, Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Dedicated Page Stylesheet -->
    <link rel="stylesheet" href="./css/properties.css" />
  </head>
  <body>
    <!-- =====================================================================
         1. HEADER BAND
         ===================================================================== -->
    <header class="properties-header-band">
      <div class="container">
        <div class="properties-header-top">
          <a href="./" class="btn-back-home" aria-label="Back to Home Page">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
            </svg>
            <span>Back to Home</span>
          </a>

          <a href="./" class="header-brand-logo" aria-label="iGrey Holdings Home">
            <span style="color: #c9a77c; font-family: serif; font-size: 24px; font-weight: 700; letter-spacing: -0.02em;">iG</span>
            <span style="font-size: 14px; font-family: var(--font-sans); letter-spacing: 0.15em; font-weight: 600; color: #FAF8F4;">iGREY</span>
          </a>
        </div>

        <div class="properties-header-content">
          <h1 class="properties-page-title">Find Your Perfect Home</h1>
          <p class="properties-page-subtitle">Premium residences for sale across South India's prime hubs</p>
        </div>
      </div>
    </header>

    <!-- =====================================================================
         2. FLOATING FILTER CARD
         ===================================================================== -->
    <div class="container">
      <div class="filter-card-wrapper">
        <section class="floating-filter-card" aria-label="Property Search and Filters">
          <!-- Row 1: Search Field -->
          <div class="filter-search-row">
            <span class="filter-search-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
              </svg>
            </span>
            <input
              type="text"
              id="filter-search"
              class="filter-search-input"
              placeholder="Search by area, city or property name..."
              aria-label="Search by area, city or property name"
              autocomplete="off"
            />
            <button type="button" id="filter-search-clear" class="filter-search-clear" aria-label="Clear search input">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
              </svg>
            </button>
          </div>

          <!-- Row 2: Five Dropdown Selects -->
          <div class="filter-dropdowns-row">
            <!-- 1. TYPE -->
            <div class="filter-select-group">
              <label for="filter-type" class="filter-select-label">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M8 10h.01"/><path d="M16 10h.01"/><path d="M8 14h.01"/><path d="M16 14h.01"/></svg>
                <span>TYPE</span>
              </label>
              <div class="filter-select-wrapper">
                <select id="filter-type">
                  <option value="all">All Types</option>
                  <option value="gated society">Gated society</option>
                  <option value="villa">Villa</option>
                  <option value="independent house">Independent house</option>
                  <option value="plot">Plot</option>
                </select>
                <span class="filter-select-chevron" aria-hidden="true">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </span>
              </div>
            </div>

            <!-- 2. BEDROOMS -->
            <div class="filter-select-group">
              <label for="filter-bhk" class="filter-select-label">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg>
                <span>BEDROOMS</span>
              </label>
              <div class="filter-select-wrapper">
                <select id="filter-bhk">
                  <option value="all">All BHK</option>
                  <option value="1">1 BHK</option>
                  <option value="2">2 BHK</option>
                  <option value="3">3 BHK</option>
                  <option value="4+">4+ BHK</option>
                </select>
                <span class="filter-select-chevron" aria-hidden="true">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </span>
              </div>
            </div>

            <!-- 3. BUDGET -->
            <div class="filter-select-group">
              <label for="filter-budget" class="filter-select-label">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12"/><path d="M6 8h12"/><path d="m6 13 8.5 8"/><path d="M6 13h3a4.5 4.5 0 0 0 0-9"/></svg>
                <span>BUDGET</span>
              </label>
              <div class="filter-select-wrapper">
                <select id="filter-budget">
                  <option value="all">Any Budget</option>
                  <option value="under-50l">Under ₹50 L</option>
                  <option value="50l-1cr">₹50 L to ₹1 Cr</option>
                  <option value="1cr-2cr">₹1 Cr to ₹2 Cr</option>
                  <option value="above-2cr">Above ₹2 Cr</option>
                </select>
                <span class="filter-select-chevron" aria-hidden="true">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </span>
              </div>
            </div>

            <!-- 4. FEATURES -->
            <div class="filter-select-group">
              <label for="filter-features" class="filter-select-label">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
                <span>FEATURES</span>
              </label>
              <div class="filter-select-wrapper">
                <select id="filter-features">
                  <option value="all">All Features</option>
                  <option value="swimming pool">Swimming pool</option>
                  <option value="gym">Gym</option>
                  <option value="clubhouse">Clubhouse</option>
                  <option value="security">24x7 security</option>
                  <option value="power backup">Power backup</option>
                  <option value="parking">Covered parking</option>
                  <option value="garden">Garden</option>
                  <option value="lift">Lift</option>
                </select>
                <span class="filter-select-chevron" aria-hidden="true">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </span>
              </div>
            </div>

            <!-- 5. SORT BY -->
            <div class="filter-select-group">
              <label for="filter-sort" class="filter-select-label">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg>
                <span>SORT BY</span>
              </label>
              <div class="filter-select-wrapper">
                <select id="filter-sort">
                  <option value="featured">Featured First</option>
                  <option value="newest">Newest First</option>
                  <option value="price-asc">Price: Low to High</option>
                  <option value="price-desc">Price: High to Low</option>
                  <option value="area-desc">Area: Large to Small</option>
                </select>
                <span class="filter-select-chevron" aria-hidden="true">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </span>
              </div>
            </div>
          </div>

          <hr class="filter-divider" />

          <!-- Row 3: City & Status Chips -->
          <div class="filter-chips-row">
            <!-- CITY Chips -->
            <div class="filter-chip-group" data-filter-group="city">
              <span class="filter-chip-group-label">CITY:</span>
              <div class="filter-chips-list" role="radiogroup" aria-label="Filter properties by city">
                <button type="button" class="chip-btn active" data-value="all" role="radio" aria-checked="true">All</button>
                <button type="button" class="chip-btn" data-value="bangalore" role="radio" aria-checked="false">Bangalore</button>
                <button type="button" class="chip-btn" data-value="mysuru" role="radio" aria-checked="false">Mysuru</button>
                <button type="button" class="chip-btn" data-value="hyderabad" role="radio" aria-checked="false">Hyderabad</button>
                <button type="button" class="chip-btn" data-value="chennai" role="radio" aria-checked="false">Chennai</button>
              </div>
            </div>

            <!-- STATUS Chips -->
            <div class="filter-chip-group" data-filter-group="status">
              <span class="filter-chip-group-label">STATUS:</span>
              <div class="filter-chips-list" role="radiogroup" aria-label="Filter properties by status">
                <button type="button" class="chip-btn active" data-value="all" role="radio" aria-checked="true">All</button>
                <button type="button" class="chip-btn" data-value="available" role="radio" aria-checked="false">Available</button>
                <button type="button" class="chip-btn" data-value="upcoming" role="radio" aria-checked="false">Upcoming</button>
                <button type="button" class="chip-btn" data-value="under offer" role="radio" aria-checked="false">Under offer</button>
                <button type="button" class="chip-btn" data-value="sold" role="radio" aria-checked="false">Sold</button>
              </div>
            </div>

            <!-- Clear filters link -->
            <button type="button" id="clear-filters-btn" class="clear-filters-link" style="display: none;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
              <span>Clear filters</span>
            </button>
          </div>
        </section>
      </div>

      <!-- ===================================================================
           3. RESULTS BAR
           =================================================================== -->
      <div class="results-bar">
        <div class="results-count-text" aria-live="polite">
          Showing <strong id="results-count">0</strong> properties
        </div>

        <div class="verified-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
          <span>100% Verified Listings</span>
        </div>
      </div>

      <!-- ===================================================================
           4. PROPERTY CARDS GRID
           =================================================================== -->
      <main class="properties-main-section">
        <div class="property-cards-grid" id="properties-grid" role="region" aria-label="Properties listings grid">
          <!-- Cards injected via js/properties-page.js -->
        </div>

        <!-- Load More Section -->
        <div class="load-more-section" id="load-more-container" style="display: none;">
          <button type="button" class="btn-load-more" id="btn-load-more">Load more properties</button>
          <span class="load-more-count-label" id="load-more-label"></span>
        </div>
      </main>
    </div>

    <!-- =====================================================================
         5. PROPERTY DETAILS POPUP MODAL
         ===================================================================== -->
    <div
      class="property-modal-backdrop"
      id="property-details-modal"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
    >
      <!-- Modal card dynamically rendered by js/properties-page.js -->
    </div>

    <!-- Page Footer -->
    <footer style="background-color: #070B09; border-top: 0.5px solid rgba(74, 63, 43, 0.4); padding: 48px 0 36px; color: var(--text-muted); font-size: 13px;">
      <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
        <div>
          <span style="font-family: var(--font-serif); font-size: 18px; color: #FAF8F4; letter-spacing: 0.05em;">iGREY HOLDINGS</span>
          <p style="margin-top: 4px; font-size: 12px; color: var(--text-muted);">Redefining Luxury Real Estate Advisory & Residential Acquisitions</p>
        </div>
        <div style="display: flex; gap: 20px; align-items: center;">
          <a href="./" style="color: var(--gold); text-decoration: none;">Home</a>
          <a href="./#about" style="color: var(--gold); text-decoration: none;">About</a>
          <a href="./#services" style="color: var(--gold); text-decoration: none;">Services</a>
          <a href="./#contact" style="color: var(--gold); text-decoration: none;">Contact</a>
          <a href="./admin/" style="color: var(--text-muted); text-decoration: none; font-size: 11px;">Admin Portal</a>
        </div>
      </div>
    </footer>

    <!-- Supabase CDN Client & Data Loader Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase-config.js"></script>
    <script src="./js/properties.js"></script>
    <script src="./js/properties-page.js"></script>
  </body>
</html>
